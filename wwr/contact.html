<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Rapids Rafting: find our address, phone number and email, view our location on the map, or send us a message to ask about trips and reservations.">
  <meta name="author" content="Christopher Camacho">

  <link rel="stylesheet" href="styles/rafting.css">

  <title>Contact Us, Rapids Rafting</title>
</head>

<body>
  <header>
    <img class="logo-icon" src="images/z-crossedoars.jpeg" alt="Rapids Rafting logo">
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>

  <main class="contact">
    <h1>Rapids Rafting Company</h1>

    <address class="contact-info">
      <p>123 Main River Street<br>Kolob, California</p>
      <p><a href="tel:+19999999999">+1 999 999 9999</a></p>
      <p><a href="mailto:info@rapids-rafting.com">info@rapids-rafting.com</a></p>
    </address>

    <div class="contact-grid">
      <div class="map-container">
        <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d790.8033369456417!2d-83.64530364651444!3d9.88311808987503!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1ses!2scr!4v1795584014670!5m2!1ses!2scr" width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>

      <form action="#" method="post" class="contact-form">
        <div class="form-row">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required>
        </div>

        <div class="form-row">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <fieldset class="form-row">
          <legend>Message Purpose</legend>
          <div>
            <input type="radio" id="purpose-general" name="purpose" value="general" checked>
            <label for="purpose-general">General Inquiry</label>
          </div>
          <div>
            <input type="radio" id="purpose-reservation" name="purpose" value="reservation">
            <label for="purpose-reservation">Reservation Question</label>
          </div>
          <div>
            <input type="radio" id="purpose-suggestion" name="purpose" value="suggestion">
            <label for="purpose-suggestion">Website Suggestion</label>
          </div>
        </fieldset>

        <div class="form-row">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="4" placeholder="Type here" required></textarea>
        </div>

        <div class="form-check">
          <input type="checkbox" id="newsletter" name="newsletter" value="yes">
          <label for="newsletter">Please subscribe me to the monthly newsletter</label>
        </div>

        <button type="submit">Get in Touch!</button>
      </form>
    </div>

    <section class="staff">
      <h2>We Are Here to Serve You</h2>
      <div class="d-flex flex-wrap mt-2 staff-list">
        <figure>
          <img class="employee-img" src="images/profile_employee_1.png" alt="Portrait of Daniel Vargas, Head River Guide">
          <figcaption>
            <strong>Daniel Vargas</strong><br>
            Head River Guide
          </figcaption>
        </figure>
        <figure>
          <img class="employee-img" src="images/profile_employee_2.png" alt="Portrait of Laura Mora, Operations Manager">
          <figcaption>
            <strong>Laura Mora</strong><br>
            Operations Manager
          </figcaption>
        </figure>
        <figure>
          <img class="employee-img" src="images/profile_employee_3.png" alt="Portrait of Carlos Rojas, Safety Instructor">
          <figcaption>
            <strong>Carlos Rojas</strong><br>
            Safety Instructor
          </figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer>
    <nav class="socialmedia">
      <p>2026 | Christopher Camacho | Rapids Rafting©</p>
      <a href="https://facebook.com">
        <img class="social-icon" src="images/facebook.svg" alt="Facebook">
      </a>
      <a href="https://linkedin.com">
        <img class="social-icon" src="images/linkedin.svg" alt="LinkedIn">
      </a>
      <a href="https://instagram.com">
        <img class="social-icon" src="images/instagram.svg" alt="Instagram">
      </a>
    </nav>
  </footer>
</body>

</html>
